[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-internships"
version = "0.1.0"
description = "ATLAS — local, free internship prospecting and outreach intelligence platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "protego>=0.3",
    "rapidfuzz>=3.9",
    "dnspython>=2.6",
    "email-validator>=2.1",
    "phonenumbers>=8.13",
    "tldextract>=5.1",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "streamlit>=1.38",
    "truststore>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.6"]
# Optional JavaScript rendering. Not required; see docs/PROVIDERS.md.
js = ["playwright>=1.45"]

[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atlas = ["db/migrations/*.sql", "geo/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: hits real external services (skipped unless ATLAS_LIVE_TESTS=1)",
]
filterwarnings = ["ignore::DeprecationWarning:tldextract.*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B023", "B905", "UP007", "UP045", "E741", "UP031", "B007"]
